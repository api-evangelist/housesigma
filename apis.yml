name: HouseSigma
kind: company
description: HouseSigma, Inc. Brokerage is a Toronto-based Canadian residential real estate
  portal and licensed brokerage that pairs map-based MLS listing search with sold-price history
  and machine-learning home valuations across Ontario, British Columbia, and Alberta. It sits
  in the challenger layer of the Canadian value chain, below CREA, which operates REALTOR.ca
  and the national Data Distribution Facility (DDF) that syndicates member boards' listings,
  and alongside Wahi, Zolo, and Properly, competing on visibility into data the boards control,
  a position it won in part through the Competition Bureau litigation that forced TRREB to
  release sold data in 2018. Its API posture is closed. There is no developer portal, no published
  API program, and no partner or data-licensing page. The subdomains developer., developers.,
  and docs.housesigma.com do not resolve in DNS, and /developers, /api, /api-docs, /openapi.json
  and /swagger.json all return the single-page-application shell rather than any contract.
  The only machine surface is housesigma.com/bkv2/api/, the private backend that powers the
  web and mobile apps, which the site's own robots.txt explicitly disallows to all crawlers
  and which publishes no documentation, terms, keys, or versioned contract. RESO is absent.
  HouseSigma does not appear among the Canadian organizations RESO lists as members, and no
  Web API or Data Dictionary certification, OData $metadata document, or Universal Property
  Identifier usage was found. No open, unlicensed dataset is published. The underlying listing
  and sold data is board-licensed and reaches HouseSigma through its own brokerage membership,
  not through anything a third-party developer can sign up for.
