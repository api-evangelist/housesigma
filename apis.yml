name: HouseSigma
kind: company
description: 'HouseSigma, Inc. Brokerage is a Toronto-based Canadian residential real estate portal
  and licensed brokerage that pairs map-based MLS listing search with sold-price history and machine-learning
  home valuations (SigmaEstimate) across Ontario, British Columbia, and Alberta. It sits in the challenger
  layer of the Canadian value chain, below CREA, which operates REALTOR.ca and the national Data
  Distribution Facility (DDF) that syndicates member boards'' listings, and alongside Wahi, Zolo,
  and Properly, competing on visibility into data the boards control, a position it won in part through
  the Competition Bureau litigation that forced TRREB to release sold data in 2018. Its API posture
  is closed. There is no developer portal, no published API program, and no partner or data-licensing
  page; developer., developers., and docs.housesigma.com do not resolve in DNS, and /developers,
  /api, /api-docs, /openapi.json and /swagger.json all return the single-page-application shell rather
  than any contract. The listing, sold-history and valuation backend at housesigma.com/bkv2/api/
  is private, keyless, undocumented, and explicitly disallowed to all crawlers in robots.txt. The
  one genuinely public, anonymously callable, machine-readable HTTP surface the company operates
  is the WordPress REST API behind housesigma.com/blog-en, which serves its Canadian housing-market
  analysis blog as JSON across 157 advertised routes; API Evangelist derived an OpenAPI for the 22
  operations verified to answer anonymously. HouseSigma also publishes a real llms.txt and mobile
  deep-link association documents. RESO is absent: HouseSigma is not among the Canadian organizations
  RESO lists as members, and no Web API or Data Dictionary certification, OData $metadata document,
  or Universal Property Identifier usage was found. No open, unlicensed dataset is published. The
  underlying listing and sold data is board-licensed and reaches HouseSigma through its own brokerage
  membership, not through anything a third-party developer can sign up for.'
