apis:
- name: HouseSigma Blog Content API
  description: 'The public, read-only WordPress REST API (wp/v2) behind housesigma.com/blog-en, which
    serves HouseSigma''s Canadian housing-market analysis blog as JSON. This is the only anonymously
    callable, machine-readable HTTP surface HouseSigma operates: 157 routes across 8 namespaces are
    advertised by the live route-discovery document at https://housesigma.com/blog-en/wp-json/ (HTTP
    200), of which 22 GET operations - posts, pages, media, categories, tags, authors, comments,
    search, the type/taxonomy/status registry, and oEmbed - were verified to answer without credentials.
    Page-number pagination with X-WP-Total / X-WP-TotalPages / RFC 8288 Link headers; errors use
    the WordPress {code,message,data.status} envelope rather than RFC 9457. It is NOT an official
    HouseSigma developer product: the company documents, supports and issues keys for nothing, and
    its listing, sold-price and SigmaEstimate valuation data is served only by the private, robots-disallowed
    /bkv2/api/ backend, which is deliberately not listed here.'
