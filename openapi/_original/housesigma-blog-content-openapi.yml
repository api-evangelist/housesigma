openapi: 3.1.0
info:
  title: HouseSigma Blog Content API
  version: wp/v2
  summary: Public, read-only WordPress REST API serving HouseSigma's Canadian housing-market blog.
  description: 'HouseSigma publishes no developer program for its real estate platform: the listing/sold/valuation
    backend at https://housesigma.com/bkv2/api/ is private and robots-disallowed. This document covers
    the one genuinely public, anonymously callable, machine-readable HTTP surface HouseSigma operates
    - the WordPress REST API (wp/v2) behind housesigma.com/blog-en, which serves the company''s Canadian
    market-analysis blog as JSON.


    This OpenAPI is DERIVED by API Evangelist from the live route-discovery document at https://housesigma.com/blog-en/wp-json/
    (157 routes across 8 namespaces, HTTP 200, fetched 2026-07-26). Every path, method, parameter name,
    type, description, default and bound below is copied from that document; nothing is invented. Only
    routes verified to return HTTP 200 to an anonymous request are included.


    Write methods (POST/PUT/PATCH/DELETE) are declared by the discovery document on most collections but
    require WordPress authentication (the document advertises application passwords at /blog-en/wp-admin/authorize-application.php)
    and are deliberately NOT modelled here. Routes that returned 401 anonymously (/wp/v2/settings, /wp/v2/block-types,
    /oembed/1.0/proxy, /basepress_kb/v1/kb_categories) are likewise excluded.


    This is not an official HouseSigma developer product. HouseSigma does not document, support, or issue
    keys for this surface; it is the standard WordPress REST API left enabled on the company''s blog host.'
  contact:
    name: HouseSigma
    url: https://housesigma.com/blog-en/contact-us/
  termsOfService: https://housesigma.com/blog-en/2018/04/25/terms-of-use/
  x-evidence:
    discovery-document: https://housesigma.com/blog-en/wp-json/
    http-status: 200
    fetched: '2026-07-26'
    derived-by: API Evangelist enrichment pipeline
    namespaces-advertised:
    - oembed/1.0
    - basepress_kb/v1
    - contact-form-7/v1
    - saswp-output
    - yoast/v1
    - wp/v2
    - wp-site-health/v1
    - wp-block-editor/v1
    routes-advertised: 157
servers:
- url: https://housesigma.com/blog-en/wp-json
  description: Production (public, read-only)
