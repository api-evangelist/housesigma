  /wp/v2/tags/{id}:
    get:
      operationId: getTag
      summary: Retrieve a tag by id
      description: Derived from the live WordPress REST route-discovery document at https://housesigma.com/blog-en/wp-json/ (route `/wp/v2/tags/(?P<id>[\d]+)`). Verified to answer anonymously over HTTPS on 2026-07-26.
      tags:
