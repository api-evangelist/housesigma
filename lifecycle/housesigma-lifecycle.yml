summary: >-
  HouseSigma runs no API lifecycle program. There is no developer portal, no versioning policy,
  no deprecation policy, no SLA, and no status page - which is the expected posture for a
  company that publishes no API. What lifecycle signal exists is inherited from the platforms
  underneath: the WordPress REST namespace version on the blog, and the internal build string
  the private backend discloses.

versioning:
