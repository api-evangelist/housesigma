  current: wp/v2
  policy_url: null
  detail: >-
    The only versioned public surface is the WordPress REST namespace (/wp-json/wp/v2/).
    HouseSigma does not author or govern it; it moves when WordPress core moves. No public
    version policy, no negotiation header, no announced version window.

